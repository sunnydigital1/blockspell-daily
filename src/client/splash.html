<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, height=device-height, user-scalable=0"
    />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="splash.css" />
    <title>Blockspell Daily</title>
  </head>
  <body>
    <main class="card">
      <img class="hero" src="/hero.png" alt="" width="874" height="450" />
      <h1 class="title"><span id="day">Blockspell Daily</span></h1>
      <p class="sub" id="sub">Same pieces, same spells, same boss for everyone. One try.</p>
      <ol class="board" id="board" aria-label="Today's top scores"></ol>
      <p class="status" id="status"></p>
      <button class="play" id="play" type="button">Play today's spell</button>
    </main>
    <script type="module" src="splash.ts"></script>
  </body>
</html>
